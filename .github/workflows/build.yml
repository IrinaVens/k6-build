name: Build k6
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
          go install go.k6.io/xk6/cmd/xk6@latest
          CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc GOOS=windows GOARCH=amd64 xk6 build latest --with github.com/mostafa/xk6-kafka/v2@latest
      - uses: actions/upload-artifact@v4
        with:
          name: k6-windows
          path: k6.exe
