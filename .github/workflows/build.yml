name: Build k6 for Windows
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build k6 using official xk6 Docker image
        run: |
          docker run --rm \
            -e GOOS=windows \
            -e GOARCH=amd64 \
            -v "${{ github.workspace }}:/xk6" \
            grafana/xk6 build latest --with github.com/mostafa/xk6-kafka/v2@latest

      - name: Upload k6.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: k6-windows
          path: k6.exe
